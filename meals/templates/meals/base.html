{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudentPlate{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'meals/css/style.css' %}?v=4">
</head>
<body>
    <!--- Shared navigation --->
    <header class="site-header">
        <nav class="navbar">
            <a class="logo" href="{% url 'home' %}">StudentPlate</a>

            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'meal_list' %}">Find Meals</a></li>
                <li><a href="{% url 'favourites' %}">Favourites</a></li>
                <li>
                    <a href="{% url 'planner' %}">
                        Planner
                    </a>
                </li>
                <li><a href="{% url 'budget' %}">My Budget</a></li>
            </ul>
        </nav>
    </header>

    <!--- Each page inserts its content here --->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!--- Shared footer --->
    <footer class="site-footer">
        <p>StudentPlate prototype for Sheffield Hallam students.</p>
    </footer>

    <!-- Individual pages can load their own JavaScript -->
    {% block extra_js %}
    {% endblock %}
</body>
</html>
